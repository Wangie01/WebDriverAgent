name: Build WDA IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tail -40

      - name: Package IPA
        run: |
          APP=$(find ./build/Build/Products -name "WebDriverAgentRunner-Runner.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WebDriverAgentRunner.ipa Payload
          ls -lh WebDriverAgentRunner.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WDA-IPA
          path: WebDriverAgentRunner.ipa
