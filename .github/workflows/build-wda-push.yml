name: Build WDA IPA (push)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build WDA for real device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tail -50

      - name: Package IPA
        run: |
          APP=$(find ./build/Build/Products -name "WebDriverAgentRunner-Runner.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WebDriverAgentRunner.ipa Payload
          ls -lh WebDriverAgentRunner.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WDA-IPA
          path: WebDriverAgentRunner.ipa
